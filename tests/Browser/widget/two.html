<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Two widgets, one page</title></head>
<body>
    <h2>Sunbeds</h2>
    <div id="a"></div>
    <script src="/embed.js" data-venue="demo-beach-bar" data-booking-type="sunbeds"
            data-target="#a" data-label="Book a sunbed" data-accent="#C9A227"></script>

    <h2>Dinner</h2>
    <div id="b"></div>
    <script src="/embed.js" data-venue="demo-beach-bar" data-booking-type="tables"
            data-target="#b" data-label="Book a table" data-accent="#0e6e6e"
            data-layout="vertical"></script>

    <h2>Just a button</h2>
    <div id="c"></div>
    <script src="/embed.js" data-venue="demo-beach-bar" data-mode="button"
            data-target="#c" data-people="6"></script>
</body>
</html>
